name: "Terraform · Dev"

on:
  push:
    branches: [main]
    paths:
      - "Task2Advanced/envs/dev/**"
      - "Task2Advanced/modules/**"
  workflow_dispatch:

# Prevent concurrent runs for the same environment to avoid state conflicts.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_DIR: Task2Advanced/envs/dev
  TF_VAR_FILE: dev.tfvars
  # Backend credentials: YC static key mapped to S3-compatible env vars.
  # Values come from GitHub Secrets — never stored in code.
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_KEY }}

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config=backend.hcl
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file="${{ env.TF_VAR_FILE }}" \
            -out=tfplan
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          # Sensitive vars injected via TF_VAR_* — not in .tfvars files.
          TF_VAR_subnet_id: ${{ secrets.TF_VAR_SUBNET_ID_DEV }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          # Scoped to run_id — prevents applying a plan from a different run.
          name: tfplan-dev-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: "Apply"
    runs-on: ubuntu-latest
    needs: plan
    # GitHub Environment — configure in Settings → Environments.
    # For dev: no required reviewers (auto-deploy after plan succeeds).
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config=backend.hcl
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        # Apply the exact plan file from the plan job — not a fresh plan.
        run: terraform apply tfplan
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_subnet_id: ${{ secrets.TF_VAR_SUBNET_ID_DEV }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
